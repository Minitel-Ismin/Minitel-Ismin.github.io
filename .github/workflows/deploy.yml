# Construit le site et le publie sur GitHub Pages à chaque push sur `main`,
# puis crée une release GitHub contenant l'archive du site déployé.
# Prérequis (une seule fois, par un admin de l'organisation) :
#   Settings → Pages → Build and deployment → Source : « GitHub Actions ».
name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/configure-pages@v6
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  release:
    # Uniquement si le déploiement a réussi
    needs: [build, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # nécessaire pour créer la release et le tag
    steps:
      # Artefact « github-pages » = artifact.tar, identique à ce qui est déployé
      - uses: actions/download-artifact@v8
        with:
          name: github-pages

      - name: Créer la release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="site-$(date -u +%Y.%m.%d)-${{ github.run_number }}"
          gzip -c artifact.tar > "${TAG}.tar.gz"
          gh release create "$TAG" "${TAG}.tar.gz" \
            --target "${{ github.sha }}" \
            --title "Site $TAG" \
            --generate-notes
